<!DOCTYPE html>
<html lang="en"
      xmlns:th="http://www.thymeleaf.org">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Add New Client | Sales Management</title>

    <link rel="stylesheet"
          th:href="@{/css/style.css}">

</head>

<body>

<div class="dashboard">

    <!-- ================= NAVBAR ================= -->

    <nav class="navbar">

        <h2>Sales Management</h2>

        <a href="/sales/logout"
           class="logout-btn">
            Logout
        </a>

    </nav>


    <!-- ================= SIDEBAR ================= -->

    <aside class="sidebar">

        <a href="/sales/dashboard"
           class="sidebar-link">

            📊 Dashboard

        </a>

        <a href="/sales/my-sales"
           class="sidebar-link">

            💰 My Sales

        </a>

        <a href="/sales/my-clients"
           class="sidebar-link active">

            👥 My Clients

        </a>

        <a href="/sales/my-target"
           class="sidebar-link">

            🎯 My Target

        </a>

        <a href="/sales/my-report"
           class="sidebar-link">

            📈 My Report

        </a>

    </aside>


    <!-- ================= CONTENT ================= -->

    <main class="dashboard-content">

        <div class="page-header">

            <div>

                <h1>
                    Add New Client
                </h1>

                <p>
                    Add a new client manually
                </p>

            </div>

        </div>


        <!-- ================= FORM CARD ================= -->

        <div class="section-card">

            <div class="section-header">

                <h2>
                    Client Details
                </h2>

            </div>


            <form
                    th:action="@{/sales/client/save}"
                    method="post"
                    class="form-grid">


                <!-- CLIENT NAME -->

                <div class="form-group">

                    <label for="clientName">
                        Client Name
                    </label>

                    <input
                            type="text"
                            id="clientName"
                            name="clientName"
                            class="form-control"
                            placeholder="Enter client name"
                            required>

                </div>

                <!-- GST NUMBER -->

<div class="form-group">

    <label for="gstNo">
        GST Number
    </label>

    <input
            type="text"
            id="gstNo"
            name="gstNo"
            class="form-control"
            placeholder="Enter GST number"
            maxlength="15"
            style="text-transform: uppercase;">

</div>


                <!-- COMPANY NAME -->

                <div class="form-group">

                    <label for="companyName">
                        Company Name
                    </label>

                    <input
                            type="text"
                            id="companyName"
                            name="companyName"
                            class="form-control"
                            placeholder="Enter company name">

                </div>


                <!-- MOBILE -->

                <div class="form-group">

                    <label for="mobile">
                        Mobile
                    </label>

                    <input
                            type="text"
                            id="mobile"
                            name="mobile"
                            class="form-control"
                            placeholder="Enter mobile number">

                </div>


                <!-- EMAIL -->

                <div class="form-group">

                    <label for="email">
                        Email
                    </label>

                    <input
                            type="email"
                            id="email"
                            name="email"
                            class="form-control"
                            placeholder="Enter email address">

                </div>


                <!-- ADDRESS -->

                <div class="form-group">

                    <label for="address">
                        Address
                    </label>

                    <textarea
                            id="address"
                            name="address"
                            class="form-control"
                            rows="4"
                            placeholder="Enter client address"></textarea>

                </div>


                <!-- ACTIONS -->

                <div class="form-actions">

                    <a
                            href="/sales/my-clients"
                            class="secondary-btn">

                        Cancel

                    </a>

                    <button
                            type="submit"
                            class="primary-btn">

                        💾 Save Client

                    </button>

                </div>

            </form>

        </div>

    </main>

</div>

</body>

</html>
