<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <title>Add Sale</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f5f6fa;
            margin: 0;
            padding: 30px;
        }

        .container {
            max-width: 1100px;
            margin: auto;
            background: white;
            padding: 25px;
            border-radius: 10px;
        }

        h2 {
            margin-bottom: 20px;
        }

        .row {
            display: flex;
            gap: 15px;
            margin-bottom: 15px;
        }

        .field {
            flex: 1;
        }

        label {
            display: block;
            margin-bottom: 5px;
            font-weight: bold;
        }

        input,
        select {
            width: 100%;
            padding: 9px;
            box-sizing: border-box;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 20px;
        }

        th,
        td {
            border: 1px solid #ddd;
            padding: 8px;
        }

        th {
            background: #f1f1f1;
        }

        .amount {
            background: #f5f5f5;
        }

        .total {
            text-align: right;
            font-size: 20px;
            font-weight: bold;
            margin-top: 20px;
        }

        button {
            padding: 10px 18px;
            border: none;
            cursor: pointer;
            border-radius: 5px;
        }

        .add-btn {
            margin-top: 15px;
        }

        .save-btn {
            margin-top: 20px;
        }

        .remove-btn {
            background: #dc3545;
            color: white;
        }
    </style>
</head>

<body>

<div class="container">

    <h2>Add Sale / Invoice</h2>

    <form th:action="@{/admin/sales/save}" method="post">

        <div class="row">

            <div class="field">
                <label>Invoice / Bill No</label>
                <input type="text"
                       name="invoiceNumber"
                       required>
            </div>

            <div class="field">
                <label>Date</label>
                <input type="date"
                       name="saleDate"
                       required>
            </div>

            <div class="field">
                <label>Customer</label>
                <input type="text"
                       name="customerName"
                       required>
            </div>

        </div>


        <div class="row">

            <div class="field">
                <label>Salesperson</label>

                <select name="salespersonId" required>

                    <option value="">
                        Select Salesperson
                    </option>

                    <option th:each="sp : ${salespersons}"
                            th:value="${sp.id}"
                            th:text="${sp.name}">
                    </option>

                </select>

            </div>

        </div>


        <h3>Products</h3>

        <table>

            <thead>
            <tr>
                <th>Product</th>
                <th>Qty</th>
                <th>Unit</th>
                <th>Price</th>
                <th>Amount</th>
                <th>Action</th>
            </tr>
            </thead>

            <tbody id="itemsBody">

            <tr>

                <td>
                    <input type="text"
                           name="productName"
                           required>
                </td>

                <td>
                    <input type="number"
                           name="quantity"
                           step="0.001"
                           min="0"
                           class="qty"
                           required>
                </td>

                <td>
                    <input type="text"
                           name="unit"
                           placeholder="NOS">
                </td>

                <td>
                    <input type="number"
                           name="price"
                           step="0.01"
                           min="0"
                           class="price"
                           required>
                </td>

                <td>
                    <input type="number"
                           name="amount"
                           class="amount"
                           readonly>
                </td>

                <td>
                    <button type="button"
                            class="remove-btn"
                            onclick="removeRow(this)">
                        Remove
                    </button>
                </td>

            </tr>

            </tbody>

        </table>


        <button type="button"
                class="add-btn"
                onclick="addRow()">
            + Add Product
        </button>


        <div class="total">
            Total:
            ₹ <span id="grandTotal">0.00</span>
        </div>


        <button type="submit"
                class="save-btn">
            Save Sale
        </button>

    </form>

</div>


<script>

function calculateRow(row) {

    const qty =
        parseFloat(row.querySelector(".qty").value) || 0;

    const price =
        parseFloat(row.querySelector(".price").value) || 0;

    const amount = qty * price;

    row.querySelector(".amount").value =
        amount.toFixed(2);

    calculateTotal();
}


function calculateTotal() {

    let total = 0;

    document.querySelectorAll(".amount")
        .forEach(input => {

            total +=
                parseFloat(input.value) || 0;

        });

    document.getElementById("grandTotal")
        .innerText = total.toFixed(2);
}


function addRow() {

    const tbody =
        document.getElementById("itemsBody");

    const row =
        document.createElement("tr");

    row.innerHTML = `

        <td>
            <input type="text"
                   name="productName"
                   required>
        </td>

        <td>
            <input type="number"
                   name="quantity"
                   step="0.001"
                   min="0"
                   class="qty"
                   required>
        </td>

        <td>
            <input type="text"
                   name="unit"
                   placeholder="NOS">
        </td>

        <td>
            <input type="number"
                   name="price"
                   step="0.01"
                   min="0"
                   class="price"
                   required>
        </td>

        <td>
            <input type="number"
                   name="amount"
                   class="amount"
                   readonly>
        </td>

        <td>
            <button type="button"
                    class="remove-btn"
                    onclick="removeRow(this)">
                Remove
            </button>
        </td>
    `;

    tbody.appendChild(row);

    attachCalculation(row);
}


function removeRow(button) {

    const tbody =
        document.getElementById("itemsBody");

    if (tbody.rows.length <= 1) {
        alert("At least one product is required.");
        return;
    }

    button.closest("tr").remove();

    calculateTotal();
}


function attachCalculation(row) {

    row.querySelector(".qty")
        .addEventListener("input",
            () => calculateRow(row));

    row.querySelector(".price")
        .addEventListener("input",
            () => calculateRow(row));
}


document
    .querySelectorAll("#itemsBody tr")
    .forEach(row => attachCalculation(row));

</script>

</body>
</html>
