<!DOCTYPE html>
<html lang="en"
      xmlns:th="http://www.thymeleaf.org">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Excel Import</title>

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f4f7f9;
        }

        .container {
            max-width: 850px;
            margin: 70px auto;
            padding: 20px;
        }

        .card {
            background: white;
            padding: 35px;
            border-radius: 15px;
            box-shadow:
                0 5px 25px rgba(0,0,0,0.08);
        }

        h1 {
            margin-top: 0;
            color: #0f766e;
        }

        .subtitle {
            color: #6b7280;
            margin-bottom: 30px;
        }

        .form-group {
            margin-bottom: 22px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            font-weight: bold;
        }

        select,
        input[type="file"] {
            width: 100%;
            padding: 12px;
            border: 1px solid #d1d5db;
            border-radius: 8px;
            background: white;
        }

        .upload-btn {
            border: none;
            padding: 13px 25px;
            background: #0f766e;
            color: white;
            border-radius: 8px;
            cursor: pointer;
            font-size: 15px;
            font-weight: bold;
        }

        .upload-btn:hover {
            background: #115e59;
        }

        .error {
            background: #fee2e2;
            color: #991b1b;
            padding: 14px;
            border-radius: 8px;
            margin-bottom: 20px;
        }

        .success {
            background: #dcfce7;
            color: #166534;
            padding: 14px;
            border-radius: 8px;
            margin-bottom: 20px;
        }

        .format-box {
            margin-top: 30px;
            padding: 20px;
            background: #f8fafc;
            border-radius: 10px;
        }

        .format-box h3 {
            margin-top: 0;
        }

        .columns {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
        }

        .column {
            background: #e2e8f0;
            padding: 8px 12px;
            border-radius: 6px;
            font-size: 13px;
        }

        .back {
            display: inline-block;
            margin-top: 20px;
            color: #0f766e;
            text-decoration: none;
        }

    </style>

</head>

<body>

<div class="container">

    <div class="card">

        <h1>Excel Sales Import</h1>

        <p class="subtitle">
            Upload your Excel sales file and preview the invoices
            before importing them.
        </p>

        <!-- ERROR -->

        <div class="error"
             th:if="${error}"
             th:text="${error}">
        </div>

        <!-- SUCCESS -->

        <div class="success"
             th:if="${success}"
             th:text="${success}">
        </div>

        <form
                th:action="@{/admin/excel-import/preview}"
                method="post"
                enctype="multipart/form-data">

            <!-- SALESPERSON -->

            <div class="form-group">

                <label>
                    Select Salesperson
                </label>

                <select
                        name="salespersonId"
                        required>

                    <option value="">
                        -- Select Salesperson --
                    </option>

                    <option th:each="sp : ${salespersons}"
        th:value="${sp.id}"
        th:text="${sp.name + ' (' + sp.employeeId + ')'}">
</option>

                </select>

            </div>

            <!-- FILE -->

            <div class="form-group">

                <label>
                    Select Excel File
                </label>

                <input
                        type="file"
                        name="file"
                        accept=".xlsx,.xls"
                        required>

            </div>

            <button
                    type="submit"
                    class="upload-btn">

                Upload & Preview

            </button>

        </form>

        <!-- FORMAT -->

        <div class="format-box">

            <h3>
                Required Excel Columns
            </h3>

            <div class="columns">

                <span class="column">Date</span>

                <span class="column">
                    Vch/Bill No
                </span>

                <span class="column">
                    Particulars
                </span>

                <span class="column">
                    Item Details
                </span>

                <span class="column">
                    Qty.
                </span>

                <span class="column">
                    Unit
                </span>

                <span class="column">
                    Price
                </span>

                <span class="column">
                    Amount
                </span>

            </div>

        </div>

        <a
                href="/admin/dashboard"
                class="back">

            ← Back to Dashboard

        </a>

    </div>

</div>

</body>

</html>
